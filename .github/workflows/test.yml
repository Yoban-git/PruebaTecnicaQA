name: E2E Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install navegadores de Playwright 
        run: node_modules/.bin/playwright install --with-deps chromium

      - name: Ejecutar flujo E2E sin inferfaz grafica (headless)
        run: npm test

      - name: Obtener historial de Allure
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generar reporte de Allure
        if: always()
        run: |
          if [ -d "gh-pages/history" ]; then
            cp -r gh-pages/history output/allure-results/history
          fi
          node_modules/.bin/allure generate output/allure-results --clean -o allure-report